baseURL: "https://yuyunc5865.github.io/"
languageCode: zh
defaultContentLanguage: zh
title: "雨韵的博客"
theme: ["PaperMod"]

caches:
  images:
    dir: :cacheDir/images

enableRobotsTXT: true

params:
  ShowToc: true
  TocOpen: true
  defaultTheme: auto
  ShowBreadCrumbs: true
  ShowPostNavLinks: true
  ShowCodeCopyButtons: true

  profileMode:
    enabled: true
    title: "雨韵的博客"
    subtitle: ""
    imageUrl: "images/头像_1024x1024.png"
    imageTitle: ""
    imageWidth: 128
    imageHeight: 128

  fuseOpts:
    isCaseSensitive: false
    shouldSort: true
    location: 0
    distance: 1000
    threshold: 0.4
    minMatchCharLength: 0
    limit: 10
    keys: ["title", "permalink", "summary", "content"]

menu:
  main:
    - identifier: archives
      name: 归档
      url: /archives/
      weight: 10
    - identifier: tags
      name: 标签
      url: /tags/
      weight: 20
    - identifier: search
      name: 搜索
      url: /search/
      weight: 30
    - identifier: github_homepage
      name: Github
      url: "https://github.com/yuyunc5865/"
      weight: 40

markup:
  goldmark:
    renderer:
      unsafe: true
  highlight:
    noClasses: false
    codeFences: true
    lineNos: true
    style: vs

outputs:
  home:
    - HTML
    - RSS
    - JSON

taxonomies:
  tag: tags

minify:
  disableXML: true
  minifyOutput: true